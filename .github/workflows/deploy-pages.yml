name: Build live demos into portfolio

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "demos/poi-editor/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "build-live-demos"
  cancel-in-progress: true

jobs:
  build-poi-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Checkout POI editor
        uses: actions/checkout@v4
        with:
          repository: gespitia/angular-maplibre-poi-editor
          ref: master
          path: poi-editor

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poi-editor/package-lock.json

      - name: Build POI editor
        working-directory: poi-editor
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base-href /demos/poi-editor/

      - name: Replace live demo files
        run: |
          rm -rf demos/poi-editor
          mkdir -p demos/poi-editor
          cp -R poi-editor/dist/angular-maplibre-poi-editor/browser/. demos/poi-editor/

      - name: Commit live demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/poi-editor
          git diff --cached --quiet && exit 0
          git commit -m "chore: update live POI editor demo [skip ci]"
          git push
