name: Deploy portfolio + live demos

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          path: portfolio

      - name: Checkout POI editor demo
        uses: actions/checkout@v4
        with:
          repository: gespitia/angular-maplibre-poi-editor
          ref: master
          path: poi-editor

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poi-editor/package-lock.json

      - name: Install and build POI editor
        working-directory: poi-editor
        run: |
          npm ci
          npm run build -- --base-href /demos/poi-editor/

      - name: Assemble site
        run: |
          mkdir -p _site/demos/poi-editor
          cp -R portfolio/. _site/
          rm -rf _site/.git _site/.github
          cp -R poi-editor/dist/angular-maplibre-poi-editor/browser/. _site/demos/poi-editor/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
